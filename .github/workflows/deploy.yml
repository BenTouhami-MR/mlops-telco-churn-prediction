name: Deploy to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  DEPLOY_PATH: /opt/mlops-app

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3  # Change to your preferred region

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy application to EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo " Navigating to deployment directory..."
            cd ${{ env.DEPLOY_PATH }}
            
            echo " Pulling latest code..."
            if [ ! -d ".git" ]; then
              echo " Git repository not found. Cloning..."
              cd ..
              sudo rm -rf mlops-app
              git clone ${{ github.server_url }}/${{ github.repository }}.git mlops-app
              cd mlops-app
            else
              # Clean up log files that may have permission issues
              sudo rm -rf orchestrator/logs/* || true
              git fetch origin
              git reset --hard origin/dev
              git pull origin dev
            fi
            
            echo " Stopping existing containers..."
            docker-compose down || true
            
            echo " Cleaning up old Docker resources..."
            docker system prune -f || true
            
            echo " Building and starting containers..."
            export AIRFLOW_UID=${{ secrets.AIRFLOW_UID }}
            docker-compose up -d --build
            
            echo " Waiting for services to be healthy..."
            sleep 30
            
            echo " Checking container status..."
            docker-compose ps
            
            echo " Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo " Verifying services are accessible..."
          
          # Wait a bit more for services to fully start
          sleep 20
          
          # Check Airflow
          if curl -f -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8080/health | grep -q "200"; then
            echo " Airflow is healthy"
          else
            echo " Airflow health check failed (may still be starting)"
          fi
          
          # Check MLflow
          if curl -f -s -o /dev/null http://${{ secrets.EC2_HOST }}:5000; then
            echo " MLflow is accessible"
          else
            echo " MLflow is not yet accessible"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem

      - name: Deployment summary
        if: success()
        run: |
          echo " Deployment successful!"
          echo ""
          echo "Access your services at:"
          echo "  Airflow:    http://${{ secrets.EC2_HOST }}:8080"
          echo "  MLflow:     http://${{ secrets.EC2_HOST }}:5000"
          echo "  Grafana:    http://${{ secrets.EC2_HOST }}:3001"
          echo "  Prometheus: http://${{ secrets.EC2_HOST }}:9090"
          echo "  Evidently:  http://${{ secrets.EC2_HOST }}:8020"
